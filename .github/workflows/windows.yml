name: Measure D3D12 warning 1361 on WARP
on: workflow_dispatch
permissions:
  contents: read
jobs:
  sampler:
    if: github.repository == 'RavenCurseBurg/Xbox2Windows' && github.ref == 'refs/heads/verify/sampler-debug-layer'
    runs-on: windows-2025
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - name: Compile the source-built probe and enable the application-local Agility SDK
        shell: pwsh
        run: |
          ./tools/dev.ps1
          $root = New-Item -ItemType Directory -Force out/check1361
          $sdk = New-Item -ItemType Directory -Force "$root/D3D12"
          Invoke-WebRequest 'https://api.nuget.org/v3-flatcontainer/microsoft.direct3d.d3d12/1.620.2/microsoft.direct3d.d3d12.1.620.2.nupkg' -OutFile "$root/agility.zip"
          Expand-Archive "$root/agility.zip" "$root/package"
          foreach ($name in 'D3D12Core.dll', 'd3d12SDKLayers.dll') {
            $native = Get-ChildItem "$root/package" -Filter $name -Recurse | Where-Object DirectoryName -match '[\\/]x64$' | Select-Object -First 1
            if (!$native) { throw "Missing x64 $name" }
            Copy-Item -LiteralPath $native.FullName -Destination $sdk
          }
          cl.exe /nologo /EHsc /std:c++17 /Isrc tests/ordinary_sampler_debug_probe.cpp "/Fo$root/probe.obj" "/Fe$root/probe.exe" /link d3d12.lib dxgi.lib
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          & "$root/probe.exe"
          exit $LASTEXITCODE
