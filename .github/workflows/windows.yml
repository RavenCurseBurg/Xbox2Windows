name: Verify startup stream adapter selection
on: workflow_dispatch
permissions:
  contents: read
jobs:
  windows:
    if: github.repository == 'RavenCurseBurg/Xbox2Windows' && github.ref == 'refs/heads/verify/startup-stream-adapter-filter'
    runs-on: windows-2025
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: d169b99bbade5123571d930617c3ba17c0204317
          persist-credentials: false
      - name: Build and package the five test drivers
        shell: pwsh
        run: |
          ./tools/dev.ps1
          python -m venv out/pe-env
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          out/pe-env/Scripts/python.exe -m pip install -r requirements-dev.txt
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cmake --preset dev -B out/W -DCMAKE_BUILD_TYPE=Release -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $targets=@('startup_stream_consumer','startup_stream_rasterizer','startup_stream_depth','startup_slot57_depth','startup_draw_depth_target')
          cmake --build out/W --target @targets
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $stage=New-Item -ItemType Directory -Force out/portable-stream-tests
          foreach ($name in (($targets | ForEach-Object { "$_.exe" }) + @('d3d12_xs.dll','xg_xs.dll'))) {
            $paths=@(Get-ChildItem out/W -File -Recurse -Filter $name)
            if ($paths.Count -ne 1) { throw "Expected one $name; found $($paths.Count)" }
            Copy-Item -LiteralPath $paths[0].FullName -Destination $stage
          }
          (git rev-parse HEAD) | Set-Content "$stage/SOURCE_COMMIT.txt" -Encoding ascii
          $files=@(Get-ChildItem -LiteralPath $stage -File)
          $files | ForEach-Object { '{0}  {1}' -f (Get-FileHash $_.FullName).Hash,$_.Name } | Set-Content "$stage/SHA256SUMS" -Encoding ascii
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: startup-stream-adapter-build
          path: out/portable-stream-tests/
          if-no-files-found: error
          retention-days: 2
      - name: Verify selection failures and WARP with a hardware selector present
        shell: pwsh
        run: |
          ./tools/dev.ps1
          $env:XBOX2WINDOWS_ADAPTER='x2w-intentionally-absent'
          $lines=ctest --test-dir out/W --no-tests=error -V -R '^(startup_stream_adapter_filter|startup_(stream_draw|stream_depth|stream_rasterizer|slot57_depth|draw_depth_target)_warp)$' 2>&1
          $rc=$LASTEXITCODE
          $lines | Select-String 'adapter=|overlong and unmatched|eight cull|slot 57|depth target occluded|32 pixels|100% tests|\*\*\*|debug layer:'
          if ($rc -or $lines -match '\*\*\*Skipped|Not Run' -or -not ($lines -match '0 tests failed out of 6')) { $lines | Select-Object -Last 120; throw "Expected six passing CTests ($rc)" }
          if (-not ($lines -match 'overlong and unmatched hardware adapter filters rejected') -or -not ($lines -match 'eight cull/winding images matched')) { throw 'Missing negative selection or WARP readback' }
