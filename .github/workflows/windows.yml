name: Verify subgroup compaction diagnostics
on: workflow_dispatch
permissions:
  contents: read
  actions: read
jobs:
  warp:
    if: github.repository == 'RavenCurseBurg/Xbox2Windows' && github.ref == 'refs/heads/verify/subgroup-compaction-diagnostics'
    runs-on: windows-2025
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: 4722d3ef1bd94cb5bd2d0642a9b266298cc44f0c
          fetch-depth: 2
          persist-credentials: false
      - name: Verify the pinned renderer and SPIR-V tools
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 45645071330 --repo RavenCurseBurg/Xbox2Windows --name split-sampler-readback-build --dir out/bins
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          if ((Get-Content out/bins/SOURCE_COMMIT.txt) -ne 'c601e6e9dcee2a96fc5b103f0bfedfe39557002d') { throw 'Unexpected renderer commit' }
          foreach ($line in Get-Content out/bins/SHA256SUMS) {
            $hash,$name=$line -split '  ',2
            if ((Get-FileHash -LiteralPath (Join-Path out/bins $name)).Hash -ne $hash) { throw "Hash mismatch for $name" }
          }
      - name: Run the registered fixture and replay a changed GPU readback
        shell: python
        run: |
          from pathlib import Path
          import subprocess
          import sys
          import tempfile
          sys.path.insert(0, str(Path("tests/spirv_window").resolve()))
          import compaction as c
          bins = Path("out/bins").resolve()
          dxc = sorted(Path("C:/Program Files (x86)/Windows Kits/10/bin").glob("*/x64/dxc.exe"))[-1]
          tools = [bins/"tools"/n for n in ("spirv-as.exe", "spirv-val.exe", "spirv-cross.exe")] + [dxc]
          renderer = bins/"offscreen_check.exe"
          run = subprocess.run([sys.executable, "-B", "tests/spirv_window/run_bridge_test.py", "tests/spirv_window/compaction.py", *tools, renderer, "warp"], capture_output=True, text=True)
          print(run.stdout + run.stderr)
          assert run.returncode == 0
          assert run.stdout.count("compared=328 mismatches=0") == 4
          assert run.stdout.count("repeat=identical") == run.stdout.count("mutated_reference=exact status=caught") == 4
          assert "debug_layer=enabled" in run.stdout and "debug_errors=0 debug_warnings=0" in run.stdout
          with tempfile.TemporaryDirectory() as tmp:
              mask = c.MASKS["mask_a"]
              mutation,predicted = c.CONTROLS["ballot_bit"]
              reference,control = [c.run(renderer, "warp", c.emit_bridge(Path(tmp), tools, mask, **args))[1] for args in ({}, mutation)]
              width = reference[c.WIDTH]
              assert width == control[c.WIDTH]
              try:
                  c.require_matching_dispatches("controlled different module", "first", reference, "repeat", control)
              except RuntimeError as error:
                  print(error)
                  assert f"first_mismatch=word=65 field=ballot first={reference[65]:08x} repeat={control[65]:08x} first_width={width} repeat_width={width}" in str(error)
              else:
                  raise AssertionError("a changed readback passed")
              other_width = 16 if width != 16 else 32
              try:
                  c.run_control("warp", control, mask, other_width, "ballot_bit", mutation, predicted)
              except RuntimeError as error:
                  print(error)
                  assert f"baseline_width={other_width} control_width={width} mutated_reference=exact" in str(error)
              else:
                  raise AssertionError("a different baseline width passed")
