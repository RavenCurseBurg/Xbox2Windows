name: Verify single-mip BC7 CPU readback on Windows
on: workflow_dispatch
permissions:
  contents: read
jobs:
  readback:
    if: github.repository == 'RavenCurseBurg/Xbox2Windows' && github.ref == 'refs/heads/verify/bc7-4k-cpu-readback'
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: 6344c7bafdbdf18fd8142db5329a27d9f448745e
          persist-credentials: false
      - name: Build and run CPU copy, address oracle and WARP draw tests
        shell: pwsh
        run: |
          ./tools/dev.ps1
          python -m venv out/pe-env
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cmake --preset dev -B out/bc7 -DCMAKE_BUILD_TYPE=Release -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cmake --build out/bc7 --target startup_stub_xg_xs startup_bc7_4k_s_check startup_bc64_supports_check startup_stream_consumer
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $lines = ctest --test-dir out/bc7 --no-tests=error -V -R '^(startup_xg_bc7_(layout|draw_warp)|startup_bc7_4k_s(_x_first_control)?|startup_bc64_supports(_layout_control)?|bc7_tile_swizzle)$' 2>&1
          $rc = $LASTEXITCODE
          $lines | Write-Output
          if ($rc) { exit $rc }
          $log = $lines -join [Environment]::NewLine
          foreach ($name in 'startup_xg_bc7_layout','startup_xg_bc7_draw_warp','startup_bc7_4k_s','startup_bc7_4k_s_x_first_control','startup_bc64_supports','startup_bc64_supports_layout_control','bc7_tile_swizzle') {
            if ($log -notmatch "$name [ .]+Passed") { throw "Test did not execute: $name" }
          }
          $stage = New-Item -ItemType Directory -Force out/bc7-artifact
          $built = @(Get-ChildItem -File -Recurse out/bc7 -Filter xg_xs.dll)
          if ($built.Count -ne 1) { throw 'Expected a single XG build' }
          Copy-Item -LiteralPath $built[0].FullName -Destination $stage
          (git rev-parse HEAD) | Set-Content -Encoding ascii "$stage/SOURCE_COMMIT.txt"
          (Get-FileHash "$stage/xg_xs.dll").Hash | Set-Content -Encoding ascii "$stage/DLL_SHA256.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: source-built-bc7
          path: out/bc7-artifact/
          retention-days: 2
          if-no-files-found: error
      - name: Confirm old no-op and ignored row pitch each fail the native comparison
        shell: pwsh
        run: |
          ./tools/dev.ps1
          $file = (Resolve-Path src/startup_stubs/xg_xs.cpp).Path
          $source = [IO.File]::ReadAllText($file)
          foreach ($name in 'no-op','tight-only') {
            if ($name -eq 'no-op') {
              $mutant = $source.Replace('slots[9] = reinterpret_cast<void*>(&bc7_4k_s_copy_from);','// leave the default slot in place')
            } else {
              $mutant = $source.Replace('surface.detile(source, dest, row_pitch);','surface.detile(source, dest, row_bytes);')
            }
            if ($mutant -ceq $source) { throw "Missing $name substitution" }
            [IO.File]::WriteAllText($file,$mutant)
            cmake --build out/bc7 --target startup_stub_xg_xs
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
            $lines = ctest --test-dir out/bc7 --no-tests=error -V -R '^startup_xg_bc7_layout$' 2>&1
            $rc = $LASTEXITCODE
            $lines | Write-Output
            if ($rc -eq 0 -or ($lines -join ' ') -notmatch 'RuntimeError: BC7 81x69 copy-out rows and guards: first difference at byte') { throw "Missing $name data failure" }
          }
          exit 0
