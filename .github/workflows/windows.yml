name: Check mesh SCC review heads on WARP
on:
  push:
    branches: ['verify/mesh-scc-review-pair']
permissions:
  contents: read
jobs:
  verify:
    if: github.repository == 'RavenCurseBurg/Xbox2Windows' && github.ref == 'refs/heads/verify/mesh-scc-review-pair'
    runs-on: windows-2025
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        pr: [2434, 2442]
        preset: [dev, release]
        include:
          - pr: 2434
            source: c696bd2d48898bafd2c2c13ee8ef63c71a3704b2
            tests: '^mesh_dynamic_aot_(cpu|draw_warp)$'
          - pr: 2442
            source: 6e90807ebf5c0eea3391d3f5edc73f66df871bf1
            tests: '^mesh_join_descriptor_warp$'
    name: 'PR ${{ matrix.pr }} / ${{ matrix.preset }} WARP'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ matrix.source }}
          persist-credentials: false
      - name: Build and test the specified revision
        shell: pwsh
        env:
          PRESET: ${{ matrix.preset }}
          EXPECTED: ${{ matrix.source }}
          PATTERN: ${{ matrix.tests }}
          PR_NUMBER: ${{ matrix.pr }}
        run: |
          ./tools/dev.ps1
          if ((git rev-parse HEAD) -ne $env:EXPECTED) { throw 'Wrong checkout' }
          python -m venv out/pe-env
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          out/pe-env/Scripts/python.exe -m pip install -r requirements-dev.txt
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cmake --preset $env:PRESET
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $kind = if ($env:PRESET -eq 'dev') { 'Debug' } else { 'Release' }
          if (-not (Select-String -Path "out/build/$env:PRESET/CMakeCache.txt" -Pattern "^CMAKE_BUILD_TYPE:STRING=$kind$")) { throw 'Wrong build type' }
          cmake --build --preset $env:PRESET --target offscreen_check
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $rows=ctest --preset $env:PRESET -V --no-tests=error -R $env:PATTERN 2>&1
          $rc=$LASTEXITCODE
          $rows | Tee-Object -FilePath out/mesh-scc.log | Select-Object -Last 18
          if ($rc -or ($rows -match '\*\*\*Skipped|Not Run')) {throw "CTest failed or skipped, exit $rc"}
          $reads = @($rows | Select-String -SimpleMatch 'pixels=1024 mismatches=0')
          Write-Host "Matching 1,024-pixel readbacks $($reads.Count)"
          if ($env:PR_NUMBER -eq '2442' -and $reads.Count -ne 18) {throw 'Expected 18 matching images'}
          if ($env:PR_NUMBER -eq '2434' -and $reads.Count -eq 0) {throw 'Expected the geometry readback'}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: 'mesh-scc-${{ matrix.pr }}-${{ matrix.preset }}'
          path: out/mesh-scc.log
          if-no-files-found: ignore
          retention-days: 3
