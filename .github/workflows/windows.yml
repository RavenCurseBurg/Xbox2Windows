name: Check RGBA8 integer render target exports on Windows
on: workflow_dispatch
permissions:
  contents: read
jobs:
  validation:
    if: github.repository == 'RavenCurseBurg/Xbox2Windows' && github.ref == 'refs/heads/verify/mrt-rgba8-integers'
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: 48e842fc39dc2738bb540b3e7b9289def611ad42
          persist-credentials: false
      - name: Build the test renderer and run both WARP compilers
        shell: pwsh
        run: |
          ./tools/dev.ps1
          python -m venv out/pe-env
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          out/pe-env/Scripts/python.exe -m pip install -r requirements-dev.txt
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cmake --preset dev -B out/mrt -DCMAKE_BUILD_TYPE=Release -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cmake --build out/mrt --target startup_stream_consumer
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $lines = ctest --test-dir out/mrt --no-tests=error -V -R '^(startup_mrt_(fxc|dxc)_warp|startup_gfx2hlsl_export_mask)$' 2>&1
          $rc = $LASTEXITCODE
          $lines | Select-Object -Last 18
          if ($rc -or $lines -match '\*\*\*Skipped|Not Run') { throw "CTest failed or skipped a fixture (exit $rc)" }
          foreach ($kind in 'fxc','dxc') {
            foreach ($target in 'uint MRT0=ffff80ff','int MRT0=ff807f7f') {
              $expected = "$kind warp RGBA8 $target; low-byte control=ff7f8000"
              $match = @($lines | Select-String -SimpleMatch $expected)
              if ($match.Count -ne 1) { throw "Missing unique readback: $expected" }
              $match[0].Line
            }
          }
          if (-not ($lines -match 'debug layer: 0x00000000 enabled') -or -not ($lines -match 'export mask checks: 0 failed')) { throw 'Missing debug layer or host export checks' }
