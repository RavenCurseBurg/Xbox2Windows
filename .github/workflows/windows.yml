name: Verify pixel batch failure attribution
on: workflow_dispatch
permissions:
  contents: read
jobs:
  batch:
    if: github.repository == 'RavenCurseBurg/Xbox2Windows' && github.ref == 'refs/heads/verify/pixel-batch-diagnostics'
    runs-on: windows-2025
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: bbae5b80c8346c52653024c362f8a0f8675e9802
          persist-credentials: false
      - name: Build and smoke-test the unmodified PR head
        shell: pwsh
        run: |
          python -m venv out/pe-env
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          ./tools/package-gpu-check.ps1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gpu-check-batch
          path: |
            out/gpu-check/Xbox2Windows-GpuCheck-win-x64.zip
            out/gpu-check/Xbox2Windows-GpuCheck-win-x64.zip.sha256
          if-no-files-found: error
          retention-days: 2
      - name: Require both WARP controls to run and pass
        shell: pwsh
        run: |
          ./tools/dev.ps1
          $build = 'out/build/gpu-check-release'
          $lines = ctest --test-dir $build --no-tests=error -V -R '^pixel_batch_(debug|removal)_warp$' 2>&1
          $code = $LASTEXITCODE
          $lines | Write-Output
          $log = $lines -join [Environment]::NewLine
          if ($code -ne 0 -or $log -notmatch 'pixel_batch_debug_warp [ .]+Passed' -or $log -notmatch 'pixel_batch_removal_warp [ .]+Passed') { throw 'Both WARP controls must execute' }
      - name: Require each broken batch implementation to fail its own check
        shell: pwsh
        run: |
          ./tools/dev.ps1
          $build = 'out/build/gpu-check-release'
          $sourcePath = (Resolve-Path 'tests/offscreen_check.cpp').Path
          $source = [IO.File]::ReadAllText($sourcePath)
          $mutations = @(
            @{ name = 'debug'; old = 'if (ctx.messages) ctx.messages->ClearStoredMessages();'; replacement = '/* keep the previous case messages */'; evidence = 'case=2 status=error' },
            @{ name = 'removal'; old = 'check(ctx.device->GetDeviceRemovedReason(), "Pixel batch device");'; replacement = '/* allow a draw on the removed device */'; evidence = 'AssertionError' }
          )
          foreach ($m in $mutations) {
            $mutant = $source.Replace($m.old, $m.replacement)
            if ($mutant -ceq $source) { throw 'Missing mutation site' }
            [IO.File]::WriteAllText($sourcePath, $mutant)
            cmake --build $build --target offscreen_check
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
            $name = $m.name
            $lines = ctest --test-dir $build --no-tests=error -V -R "^pixel_batch_${name}_warp$" 2>&1
            $code = $LASTEXITCODE
            $lines | Write-Output
            if ($code -eq 0 -or ($lines -join ' ') -notmatch $m.evidence) { throw "Mutation $name did not fail the expected check" }
          }
          exit 0
