name: Check live slot 67 translation and shutdown
on:
  push:
    branches: ['verify/slot67-compute-live-retry']
permissions:
  contents: read
jobs:
  timing:
    if: github.repository == 'RavenCurseBurg/Xbox2Windows' && github.ref == 'refs/heads/verify/slot67-compute-live-retry'
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: live-retry
            source: 86415999f855f81d4de368269915ed7ece008ed4
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ matrix.source }}
          persist-credentials: false
      - name: Build the stream consumer and collect source digests
        shell: pwsh
        run: |
          ./tools/dev.ps1
          python -m venv out/pe-env
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          out/pe-env/Scripts/python.exe -m pip install -r requirements-dev.txt
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cmake --preset release -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cmake --build --preset release --target startup_stream_consumer startup_indirect_dispatch
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $stage = New-Item -ItemType Directory -Force out/mrt-artifact
          foreach ($name in 'xg_xs.dll','d3d12_xs.dll','startup_stream_consumer.exe','startup_indirect_dispatch.exe') {
            $files = @(Get-ChildItem out/build/release -File -Recurse -Filter $name)
            if ($files.Count -ne 1) { throw "Expected one built $name" }
            Copy-Item -LiteralPath $files[0].FullName -Destination $stage
          }
          (git rev-parse HEAD) | Set-Content -Encoding ascii "$stage/SOURCE_COMMIT.txt"
          Get-ChildItem $stage -File | ForEach-Object { '{0}  {1}' -f (Get-FileHash -LiteralPath $_.FullName).Hash,$_.Name } | Set-Content -Encoding ascii "$stage/SHA256SUMS"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: slot67-consumer-${{ matrix.label }}
          path: out/mrt-artifact/
          retention-days: 2
          if-no-files-found: error
      - name: Check late publication on the same pipeline and direct Dispatch on WARP
        shell: pwsh
        run: |
          ./tools/dev.ps1
          $rows=ctest --preset release --no-tests=error -j 1 -V -R '^startup_(compute_live_retry|compute_dispatch|slot67_indirect_dispatch|indirect_dispatch|indirect_root_constants|indirect_count)_warp$' 2>&1
          $result=$LASTEXITCODE
          $rows | Tee-Object -FilePath out/slot67-warp.log | Select-Object -Last 12
          if ($result -or $rows -match '\*\*\*Skipped|Not Run') {throw "Failed or skipped a WARP check, exit $result"}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: slot67-results-${{ matrix.label }}
          path: out/slot67-warp.log
          if-no-files-found: ignore
          retention-days: 2
