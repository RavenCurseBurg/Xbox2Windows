name: Verify startup masked bit counts with the D3D12 debug layer
on: workflow_dispatch
permissions:
  contents: read
jobs:
  gather:
    if: github.repository == 'RavenCurseBurg/Xbox2Windows' && github.ref == 'refs/heads/verify/startup-compute-mbcnt'
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: be690e82a2a137d6003f92e920293ba6c3b4b963
          persist-credentials: false
      - name: Build the test renderer with the project-supported Agility SDK
        shell: pwsh
        run: |
          ./tools/dev.ps1
          python -m venv out/pe-env
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          out/pe-env/Scripts/python.exe -m pip install -r requirements-dev.txt
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $sdk = New-Item -Force -ItemType Directory out/agility
          $pkg = Join-Path $sdk.FullName 'sdk.nupkg'
          Invoke-WebRequest 'https://api.nuget.org/v3-flatcontainer/microsoft.direct3d.d3d12/1.620.2/microsoft.direct3d.d3d12.1.620.2.nupkg' -OutFile $pkg
          if ((Get-FileHash -LiteralPath $pkg).Hash -ne '70489669C2BBEAF318B62D72B0AC3E753D521387BFC848C9763791C4E920BFCC') { throw 'SDK hash differs' }
          $zip = [IO.Compression.ZipFile]::OpenRead($pkg)
          try {
            foreach ($name in 'D3D12Core.dll','d3d12SDKLayers.dll') {
              [IO.Compression.ZipFileExtensions]::ExtractToFile($zip.GetEntry("build/native/bin/x64/$name"),(Join-Path $sdk.FullName $name))
            }
          } finally { $zip.Dispose() }
          cmake --preset dev -B out/mbcnt-check -DCMAKE_BUILD_TYPE=Release -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded "-DOFFSCREEN_AGILITY_620_DIR=$($sdk.FullName)"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cmake --build out/mbcnt-check --target offscreen_check
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $stage = New-Item -Force -ItemType Directory out/mbcnt-artifact
          Copy-Item -LiteralPath out/mbcnt-check/offscreen_check.exe -Destination $stage
          (git rev-parse HEAD) | Set-Content -Encoding ascii "$stage/SOURCE_COMMIT.txt"
          (Get-FileHash -LiteralPath "$stage/offscreen_check.exe").Hash | Set-Content -Encoding ascii "$stage/RENDERER_SHA256.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: renderer-source-build
          path: out/mbcnt-artifact/
          retention-days: 2
          if-no-files-found: error
      - name: Run WARP and check the debug layer and mismatch counts
        shell: pwsh
        run: |
          ./tools/dev.ps1
          out/mbcnt-check/offscreen_check.exe --self-test
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $lines = ctest --test-dir out/mbcnt-check --no-tests=error -V -R '^startup_gfx2hlsl_compute_(controls|warp|mbcnt_warp)$' 2>&1
          $rc = $LASTEXITCODE
          $lines | Write-Output
          if ($rc) { exit $rc }
          $log = $lines -join [Environment]::NewLine
          foreach ($required in 'backend=warp debug_layer=enabled','debug_errors=0 debug_warnings=0','case D-wrap: all 320 words match','control d-mask: rejected at word=8','control d-whole-mask: rejected at word=0','control d-x-only: rejected at word=16','control d-base: rejected at word=0','control d-hi: rejected at word=5','control d-exec: rejected at word=2') {
            if ($log -notmatch $required) { throw "Missing result: $required" }
          }
