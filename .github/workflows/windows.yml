name: Build the startup 2D LOD view measurement fixture
on: workflow_dispatch
permissions:
  contents: read
jobs:
  d16:
    if: github.repository == 'RavenCurseBurg/Xbox2Windows' && github.ref == 'refs/heads/verify/startup-get-lod-srv'
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: 705cf8224bedd9598104913f66b8df03f4c350bd
          persist-credentials: false
      - name: Build the test renderer with the project-supported Agility SDK
        shell: pwsh
        run: |
          ./tools/dev.ps1
          python -m venv out/pe-env
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          out/pe-env/Scripts/python.exe -m pip install -r requirements-dev.txt
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $sdk = New-Item -Force -ItemType Directory out/agility
          $pkg = Join-Path $sdk.FullName 'sdk.nupkg'
          Invoke-WebRequest 'https://api.nuget.org/v3-flatcontainer/microsoft.direct3d.d3d12/1.620.2/microsoft.direct3d.d3d12.1.620.2.nupkg' -OutFile $pkg
          if ((Get-FileHash -LiteralPath $pkg).Hash -ne '70489669C2BBEAF318B62D72B0AC3E753D521387BFC848C9763791C4E920BFCC') { throw 'SDK hash differs' }
          $zip = [IO.Compression.ZipFile]::OpenRead($pkg)
          try {
            foreach ($name in 'D3D12Core.dll','d3d12SDKLayers.dll') {
              [IO.Compression.ZipFileExtensions]::ExtractToFile($zip.GetEntry("build/native/bin/x64/$name"),(Join-Path $sdk.FullName $name))
            }
          } finally { $zip.Dispose() }
          cmake --preset dev -B out/d16-check -DCMAKE_BUILD_TYPE=Release -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded "-DOFFSCREEN_AGILITY_620_DIR=$($sdk.FullName)"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cmake --build out/d16-check --target offscreen_check
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $stage = New-Item -Force -ItemType Directory out/d16-artifact
          Copy-Item -LiteralPath out/d16-check/offscreen_check.exe -Destination $stage
          (git rev-parse HEAD) | Set-Content -Encoding ascii "$stage/SOURCE_COMMIT.txt"
          (Get-FileHash -LiteralPath "$stage/offscreen_check.exe").Hash | Set-Content -Encoding ascii "$stage/RENDERER_SHA256.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: startup-get-lod-srv-fixture
          path: out/d16-artifact/
          retention-days: 2
          if-no-files-found: error
