name: Measure narrowed RGBA8 integer exports on Windows
on: workflow_dispatch
permissions:
  contents: read
jobs:
  timing:
    if: github.repository == 'RavenCurseBurg/Xbox2Windows' && github.ref == 'refs/heads/measure/mrt-rgba8-integers'
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: f816ef0bee387e61a7c9ef71b32bea4e77537199
          persist-credentials: false
      - name: Build the stream consumer and collect source digests
        shell: pwsh
        run: |
          ./tools/dev.ps1
          python -m venv out/pe-env
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          out/pe-env/Scripts/python.exe -m pip install -r requirements-dev.txt
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cmake --preset dev -B out/mrt -DCMAKE_BUILD_TYPE=Release -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cmake --build out/mrt --target startup_stream_consumer
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $stage = New-Item -ItemType Directory -Force out/mrt-artifact
          foreach ($name in 'xg_xs.dll','d3d12_xs.dll','startup_stream_consumer.exe') {
            $files = @(Get-ChildItem out/mrt -File -Recurse -Filter $name)
            if ($files.Count -ne 1) { throw "Expected one built $name" }
            Copy-Item -LiteralPath $files[0].FullName -Destination $stage
          }
          (git rev-parse HEAD) | Set-Content -Encoding ascii "$stage/SOURCE_COMMIT.txt"
          Get-ChildItem $stage -File | ForEach-Object { '{0}  {1}' -f (Get-FileHash -LiteralPath $_.FullName).Hash,$_.Name } | Set-Content -Encoding ascii "$stage/SHA256SUMS"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: startup-mrt-rgba8-build
          path: out/mrt-artifact/
          retention-days: 2
          if-no-files-found: error
      - name: Compare direct HLSL and translated MRT exports
        shell: pwsh
        run: |
          ./tools/dev.ps1
          $consumer = (Resolve-Path out/mrt-artifact/startup_stream_consumer.exe).Path
          $dxc = ((Select-String out/mrt/CMakeCache.txt -Pattern '^DXC_EXECUTABLE:FILEPATH=').Line -split '=',2)[1]
          $fxc = ((Select-String out/mrt/CMakeCache.txt -Pattern '^STARTUP_FXC:FILEPATH=').Line -split '=',2)[1]
          foreach ($kind in 'fxc','dxc') {
            $lines = out/pe-env/Scripts/python.exe -B tests/measure_startup_mrt_rgba8.py $consumer warp $kind $dxc $fxc 2>&1
            $rc = $LASTEXITCODE
            if ($rc) { $lines | Select-Object -Last 45; throw "measurement exit $rc" }
            $rows = @($lines | Select-String '^RGBA8_RESULT ')
            if ($rows.Count -ne 6) { throw "Expected six measured outputs, found $($rows.Count)" }
            foreach ($row in $rows) {
              $data = $row.Line.Substring(13) | ConvertFrom-Json
              if ($data.debug -notmatch ' enabled$') { throw 'Debug layer unavailable' }
              $row.Line
            }
          }
