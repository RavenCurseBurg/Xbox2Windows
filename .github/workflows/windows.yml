name: Verify split sampler readbacks and package the pinned tools
on: workflow_dispatch
permissions:
  contents: read
jobs:
  verify:
    if: github.repository == 'RavenCurseBurg/Xbox2Windows' && github.ref == 'refs/heads/verify/intel-split-sampler-readback'
    runs-on: windows-2025
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: 17ab11a83b6a866425ae9be14834dff4a9242f01
          persist-credentials: false
      - name: Identify the toolset
        id: toolset
        shell: pwsh
        run: |
          ./tools/dev.ps1
          "msvc=$env:VCToolsVersion" >> $env:GITHUB_OUTPUT
      - uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae
        with:
          path: out/tools/spirv/bin
          key: spirv-cli-${{ runner.os }}-msvc-${{ steps.toolset.outputs.msvc }}-${{ hashFiles('tools/setup-spirv-tools.ps1', 'tools/patches/spirv-cross-minlod.patch') }}
      - name: Build the renderer and pinned SPIRV tools
        shell: pwsh
        run: |
          ./tools/dev.ps1
          ./tools/setup-spirv-tools.ps1
          python -m venv out/pe-env
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          out/pe-env/Scripts/python.exe -m pip install -r requirements-dev.txt
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $bin=(Resolve-Path out/tools/spirv/bin).Path
          cmake --preset dev -B out/W -DCMAKE_BUILD_TYPE=Release -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded "-DSPIRV_WINDOW_AS=$bin/spirv-as.exe" "-DSPIRV_WINDOW_VAL=$bin/spirv-val.exe" "-DSPIRV_WINDOW_CROSS=$bin/spirv-cross.exe"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cmake --build out/W --target offscreen_check
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $stage=New-Item -ItemType Directory -Force out/sampler-build
          Copy-Item out/W/offscreen_check.exe $stage
          if (Test-Path out/W/D3D12) { Copy-Item out/W/D3D12 -Recurse -Destination $stage }
          Copy-Item $bin -Recurse -Destination (Join-Path $stage 'tools')
          (git rev-parse HEAD) | Set-Content -Encoding ascii "$stage/SOURCE_COMMIT.txt"
          Get-ChildItem $stage -File -Recurse | ForEach-Object { '{0}  {1}' -f (Get-FileHash $_.FullName).Hash,([IO.Path]::GetRelativePath($stage.FullName,$_.FullName)) } | Set-Content -Encoding ascii "$stage/SHA256SUMS"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: split-sampler-readback-build
          path: out/sampler-build/
          retention-days: 2
          if-no-files-found: error
      - name: Run both WARP tests and check all twelve translated readback words per table
        shell: pwsh
        run: |
          ./tools/dev.ps1
          $lines=ctest --test-dir out/W --no-tests=error -V -R '^(spirv_sampler_views|sampler_index_control)_warp$' 2>&1
          $rc=$LASTEXITCODE
          $lines | Select-String 'sampler table:|sampler swap|control=|debug_layer=|debug_errors=|100% tests'
          if ($rc -or $lines -match '\*\*\*Skipped|Not Run') { throw "Failed or skipped test ($rc)" }
          foreach ($line in 'sampler swap 0: sample 0.25 0.75, comparison 0 1','sampler swap 1: sample 0.75 0.25, comparison 0 1','sampler swap 2: sample 0.25 0.75, comparison 1 0') {
            if (@($lines | Select-String -SimpleMatch $line).Count -ne 2) { throw "Missing both tables for $line" }
          }
          if (@($lines -match 'debug_layer=enabled').Count -ne 3 -or -not ($lines -match 'dispatch_thread_control=pass group_index_reproduction=matches')) { throw 'Missing paired direct control or debug layer' }
