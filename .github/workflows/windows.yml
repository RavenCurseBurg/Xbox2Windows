name: Hosted Windows check fixtures
on: workflow_dispatch
permissions:
  contents: read
jobs:
  fixtures:
    if: github.repository == 'RavenCurseBurg/Xbox2Windows' && github.ref == 'refs/heads/verify/windows-runner-output'
    runs-on: windows-2025
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: 630c5438958f09fff877e259dc9c11c819b5257b
          persist-credentials: false
      - uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - name: Run both fixtures with an 8.3 temporary directory
        shell: pwsh
        run: |
          $fixtureDir = New-Item -ItemType Directory -Path (Join-Path $env:RUNNER_TEMP 'Long fixture directory')
          $fso = New-Object -ComObject Scripting.FileSystemObject
          $env:TMPDIR = $fso.GetFolder($fixtureDir.FullName).ShortPath
          if ($env:TMPDIR -eq $fixtureDir.FullName) { throw 'Runner did not provide an 8.3 path for the fixture' }
          python -B tests/call_evidence_check.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -B tests/startup_run_ps1_check.py
          exit $LASTEXITCODE
