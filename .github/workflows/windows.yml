name: Verify SDWA select destination readbacks
on: workflow_dispatch
permissions:
  contents: read
jobs:
  warp:
    if: github.repository == 'RavenCurseBurg/Xbox2Windows' && github.ref == 'refs/heads/verify/sdwa-cndmask-destination'
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: 5537320e356153f784167d68a484be64d46f97c7
          persist-credentials: false
      - name: Run host controls and debug-layer WARP pixel draws
        shell: pwsh
        run: |
          ./tools/dev.ps1
          python -m venv out/pe-env
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          out/pe-env/Scripts/python.exe -m pip install -r requirements-dev.txt
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cmake --preset dev -B out/W -DCMAKE_BUILD_TYPE=Release -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cmake --build out/W --target offscreen_check
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $lines = ctest --test-dir out/W --no-tests=error -V -R '^startup_gfx2hlsl_sdwa_cndmask(_warp)?$' 2>&1
          $rc = $LASTEXITCODE
          $lines | Select-String 'debug_layer=|debug_errors=|all 256 pixels|destination mutation|100% tests|\*\*\*'
          if ($rc -or $lines -match '\*\*\*Skipped|Not Run') { throw "Failed or skipped CTest ($rc)" }
          if (@($lines -match 'all 256 pixels matched').Count -ne 4 -or @($lines -match 'debug_layer=enabled').Count -ne 4) { throw 'Missing positive WARP readbacks with debug layer' }
          foreach ($kind in 'fxc','dxc') {
            foreach ($mode in 'preserved padding','low word only') {
              foreach ($result in 'fails against the model','matches its own model') {
                $expected = "$kind (warp) destination mutation ($mode) ${result}: ok"
                if (@($lines | Select-String -SimpleMatch $expected).Count -ne 1) { throw "Missing $expected" }
              }
            }
          }
