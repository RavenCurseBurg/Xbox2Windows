name: Check narrow integer render target exports on Windows
on: workflow_dispatch
permissions:
  contents: read
jobs:
  validation:
    if: github.repository == 'RavenCurseBurg/Xbox2Windows' && github.ref == 'refs/heads/verify/mrt-narrow-runtime'
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: b105847c6502cf889f6982d7047ab3236c1ab15d
          persist-credentials: false
      - name: Build the test renderer and run both WARP compilers
        shell: pwsh
        run: |
          ./tools/dev.ps1
          python -m venv out/pe-env
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          out/pe-env/Scripts/python.exe -m pip install -r requirements-dev.txt
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cmake --preset dev -B out/mrt -DCMAKE_BUILD_TYPE=Release -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cmake --build out/mrt --target startup_stream_consumer
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $lines = ctest --test-dir out/mrt --no-tests=error -V -R '^(startup_mrt_(fxc|dxc)_warp|startup_gfx2hlsl_export_mask)$' 2>&1
          $rc = $LASTEXITCODE
          $lines | Select-Object -Last 18
          if ($rc -or $lines -match '\*\*\*Skipped|Not Run') { throw "CTest failed or skipped a fixture (exit $rc)" }
          foreach ($kind in 'fxc','dxc') {
            $seen = @($lines | Select-String -Pattern "[: ]$kind warp narrow format [0-9]+ MRT0=[0-9a-f]+; UNORM MRT1=ff0000ff")
            if ($seen.Count -ne 11) { throw "Expected 11 $kind WARP readbacks, found $($seen.Count)" }
            foreach ($row in $seen) { $row.Line }
            foreach ($needle in "$kind warp three-channel integer formats (7, 8) refused at translation", "$kind warp FLOAT format 41 exact 0100c07f") {
              if (-not ($lines | Select-String -SimpleMatch $needle)) { throw "Missing: $needle" }
            }
          }
          if (-not ($lines -match 'debug layer: 0x00000000 enabled') -or -not ($lines -match 'export mask checks: 0 failed')) { throw 'Missing debug layer or host export checks' }
