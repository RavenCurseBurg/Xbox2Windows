name: Check stream rasterizer winding on Windows
on: workflow_dispatch
permissions:
  contents: read
jobs:
  warp:
    if: github.repository == 'RavenCurseBurg/Xbox2Windows' && github.ref == 'refs/heads/verify/stream-rasterizer-winding'
    runs-on: windows-2025
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: 45f42d76f34c0075b926f40b44022e69afe30862
          fetch-depth: 2
          persist-credentials: false
      - name: Build the unmodified fixture and shim
        shell: pwsh
        run: |
          ./tools/dev.ps1
          python -m venv out/pe-env
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          out/pe-env/Scripts/python.exe -m pip install -r requirements-dev.txt
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cmake --preset dev -B out/raster -DCMAKE_BUILD_TYPE=Release -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cmake --build out/raster --target startup_stream_rasterizer
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $stage = New-Item -ItemType Directory -Force out/raster-artifact
          foreach ($name in 'd3d12_xs.dll','startup_stream_rasterizer.exe') {
            $bins = @(Get-ChildItem out/raster -File -Recurse -Filter $name)
            if ($bins.Count -ne 1) { throw "Expected a single $name" }
            Copy-Item -LiteralPath $bins[0].FullName -Destination $stage
          }
          (git rev-parse HEAD) | Set-Content -Encoding ascii "$stage/SOURCE_COMMIT.txt"
          Get-ChildItem $stage -File | ForEach-Object { '{0}  {1}' -f (Get-FileHash -LiteralPath $_.FullName).Hash,$_.Name } | Set-Content -Encoding ascii "$stage/SHA256SUMS"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: stream-rasterizer-winding-build
          path: out/raster-artifact/
          retention-days: 2
          if-no-files-found: error
      - name: Run the normal WARP entries and require the debug layer
        shell: pwsh
        run: |
          ./tools/dev.ps1
          $lines = ctest --test-dir out/raster -V --no-tests=error -R '^startup_stream_rasterizer(_ignore)?_warp$' 2>&1
          $rc = $LASTEXITCODE
          $lines | Select-Object -Last 25
          if ($rc -or $lines -match '\*\*\*Skipped|Not Run') { throw "CTest failed or skipped a test (exit $rc)" }
          foreach ($needle in 'eight cull/winding images matched','ignore control failed because the stream rasterizer changed','debug layer: 0x00000000 enabled') {
            if (-not ($lines | Select-String -SimpleMatch $needle)) { throw "Missing: $needle" }
          }
      - name: Compare old and new assertions on two mutated runtime builds
        shell: pwsh
        run: |
          ./tools/dev.ps1
          $env:X2W_FXC = ((Select-String out/raster/CMakeCache.txt -Pattern '^STARTUP_FXC:FILEPATH=').Line -split '=',2)[1]
          $runner = (Get-ChildItem out/raster -File -Recurse -Filter startup_stream_rasterizer.exe).FullName
          git show HEAD^:tests/startup_stream_rasterizer_check.py | Set-Content -Encoding utf8 tests/old_stream_rasterizer_check.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $path = (Resolve-Path src/startup_stubs/d3d12_draw.inl).Path
          $original = [IO.File]::ReadAllText($path)
          $needle = 'desc.RasterizerState = bound.rasterizer;'
          if ([regex]::Matches($original,[regex]::Escape($needle)).Count -ne 1) { throw 'Missing unique assignment' }
          $mutants = [ordered]@{
            'ignore-winding' = 'desc.RasterizerState.FrontCounterClockwise = FALSE;'
            'swap-cull' = 'if (desc.RasterizerState.CullMode == D3D12_CULL_MODE_BACK) desc.RasterizerState.CullMode = D3D12_CULL_MODE_FRONT; else if (desc.RasterizerState.CullMode == D3D12_CULL_MODE_FRONT) desc.RasterizerState.CullMode = D3D12_CULL_MODE_BACK;'
          }
          foreach ($key in $mutants.Keys) {
            [IO.File]::WriteAllText($path,$original.Replace($needle,($needle + [char]10 + $mutants[$key])))
            cmake --build out/raster --target startup_stream_rasterizer
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
            $baseline = out/pe-env/Scripts/python.exe -B tests/old_stream_rasterizer_check.py $runner warp 2>&1
            if ($LASTEXITCODE) { $baseline | Select-Object -Last 12; throw "Old fixture did not pass for $key" }
            $candidate = out/pe-env/Scripts/python.exe -B tests/startup_stream_rasterizer_check.py $runner warp 2>&1
            $rc = $LASTEXITCODE
            $expected = if ($key -eq 'ignore-winding') { 'ccw_back: expected the scissored triangle' } else { 'front: expected the scissored triangle' }
            if ($rc -ne 1 -or -not ($candidate | Select-String -SimpleMatch $expected)) { $candidate | Select-Object -Last 12; throw "Wrong failure for $key" }
            "$key : prior exit 0, new exit $rc, $expected"
          }
          exit 0
