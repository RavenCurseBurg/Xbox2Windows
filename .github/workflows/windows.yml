name: Build the heap-store fixture renderer

on: workflow_dispatch

permissions:
  contents: read

jobs:
  renderer:
    if: github.repository == 'RavenCurseBurg/Xbox2Windows' && github.ref == 'refs/heads/verify/heap-store-renderer'
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          repository: R0Y00/Xbox2Windows
          ref: ab9a020c0783f9ce1dd10876cbeb119707b9ada9
          persist-credentials: false
      - name: Build and smoke-test the upstream GPU package
        shell: pwsh
        run: ./tools/package-gpu-check.ps1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gpu-check-windows-x64
          path: |
            out/gpu-check/Xbox2Windows-GpuCheck-win-x64.zip
            out/gpu-check/Xbox2Windows-GpuCheck-win-x64.zip.sha256
          if-no-files-found: error
          retention-days: 2
