name: Verify the Scarlett BC copy-out ABI
on: workflow_dispatch
permissions:
  contents: read
jobs:
  copy:
    if: github.repository == 'RavenCurseBurg/Xbox2Windows' && github.ref == 'refs/heads/verify/scarlett-bc-copy-from'
    runs-on: windows-2025
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: af63f0dcf208f2cdaaa1d0e4c547ceebbd428d1a
          persist-credentials: false
      - name: Build the source and execute single-slice and array tests
        shell: pwsh
        run: |
          ./tools/dev.ps1
          python -m venv out/pe-env
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cmake --preset dev -B out/bc-check -DCMAKE_BUILD_TYPE=Release -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cmake --build out/bc-check --target startup_stream_consumer startup_stub_xg_xs
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $lines = ctest --test-dir out/bc-check --no-tests=error -V -R '^startup_xg_(bc7_layout|bc_(chain|array)_warp)$' 2>&1
          $rc = $LASTEXITCODE
          $lines | Write-Output
          $log = $lines -join [Environment]::NewLine
          foreach ($name in 'startup_xg_bc7_layout','startup_xg_bc_chain_warp','startup_xg_bc_array_warp') {
            if ($log -notmatch "$name [ .]+Passed") { throw "Missing executed test $name" }
          }
          if ($rc) { exit $rc }
      - name: Record the source and digests for the local adapter check
        shell: pwsh
        run: |
          $stage = New-Item -ItemType Directory -Force out/bc-artifact
          foreach ($name in 'xg_xs.dll','d3d12_xs.dll','startup_stream_consumer.exe') {
            $files = @(Get-ChildItem out/bc-check -File -Recurse -Filter $name)
            if ($files.Count -ne 1) { throw "Expected one built $name" }
            Copy-Item -LiteralPath $files[0].FullName -Destination $stage
          }
          (git rev-parse HEAD) | Set-Content -Encoding ascii "$stage/SOURCE_COMMIT.txt"
          Get-ChildItem $stage -File | ForEach-Object { '{0}  {1}' -f (Get-FileHash -LiteralPath $_.FullName).Hash,$_.Name } | Set-Content -Encoding ascii "$stage/SHA256SUMS"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bc-abi-source-build
          path: out/bc-artifact/
          retention-days: 2
          if-no-files-found: error
      - name: Check that the old slot-9 prototype fails the public call
        shell: pwsh
        run: |
          ./tools/dev.ps1
          $file = (Resolve-Path src/startup_stubs/xg_xs.cpp).Path
          $src = [IO.File]::ReadAllText($file)
          $old = $src.Replace('&bc64_copy_from);','&bc64_copy<false>);')
          if ($old -ceq $src) { throw 'Missing slot registration' }
          [IO.File]::WriteAllText($file,$old)
          cmake --build out/bc-check --target startup_stub_xg_xs
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $lines = ctest --test-dir out/bc-check --no-tests=error -V -R '^startup_xg_bc_chain_warp$' 2>&1
          $rc = $LASTEXITCODE
          $lines | Write-Output
          if ($rc -eq 0 -or ($lines -join ' ') -notmatch 'assert copy_from\(computer, result, 0, level, 0, guest, row_pitch, 0\) == 0') { throw 'Expected a refusal of the valid zero-option call' }
          exit 0

      - name: Check both clients reject an inverted Scarlett-option guard
        shell: pwsh
        run: |
          ./tools/dev.ps1
          git restore -- src/startup_stubs/xg_xs.cpp
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $path = (Resolve-Path src/startup_stubs/xg_bc64.inl).Path
          $src = [IO.File]::ReadAllText($path)
          $mutant = $src.Replace('if (scarlett_option != 0)', 'if (scarlett_option == 0)')
          if ($mutant -ceq $src) { throw 'Missing option guard' }
          [IO.File]::WriteAllText($path,$mutant)
          cmake --build out/bc-check --target startup_stub_xg_xs
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          foreach ($case in 'chain','array') {
            $lines = ctest --test-dir out/bc-check --no-tests=error -V -R "^startup_xg_bc_${case}_warp$" 2>&1
            $rc = $LASTEXITCODE
            $lines | Write-Output
            $expected = if ($case -eq 'chain') { 'assert copy_from\(computer, result, 0, level, 0, guest, row_pitch, 0\) == 0' } else { 'assert COPY_FROM\(vt\[9\]\)\(instance, dst, 0, sub, 0, base, pitch, len\(linear\)\) == 0' }
            if ($rc -eq 0 -or ($lines -join ' ') -cnotmatch $expected) { throw "Missing expected $case rejection" }
          }
          exit 0
