name: Verify fractional MinLod boundaries
on: workflow_dispatch
permissions:
  contents: read
  actions: read
jobs:
  warp:
    if: github.repository == 'RavenCurseBurg/Xbox2Windows' && github.ref == 'refs/heads/verify/minlod-point-boundaries'
    runs-on: windows-2025
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: 3d1b95c315c3a0941065ed9493d7147b6910e691
          fetch-depth: 2
          persist-credentials: false
      - name: Verify the pinned renderer and SPIR-V tools
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 45645071330 --repo RavenCurseBurg/Xbox2Windows --name split-sampler-readback-build --dir out/bins
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          if ((Get-Content out/bins/SOURCE_COMMIT.txt) -ne 'c601e6e9dcee2a96fc5b103f0bfedfe39557002d') { throw 'Unexpected renderer commit' }
          foreach ($line in Get-Content out/bins/SHA256SUMS) {
            $hash,$name=$line -split '  ',2
            if ((Get-FileHash -LiteralPath (Join-Path out/bins $name)).Hash -ne $hash) { throw "Hash mismatch for $name" }
          }
      - name: Run the stock draw and the old and new assertions on 1/128-quantized translated clamps
        shell: pwsh
        run: |
          $dxcs=@(Get-ChildItem 'C:/Program Files (x86)/Windows Kits/10/bin/*/x64/dxc.exe' | Sort-Object FullName -Descending)
          if (-not $dxcs.Count) { throw 'Missing DXC' }
          & $dxcs[0].FullName --version
          $argsList=@((Resolve-Path out/bins/tools/spirv-as.exe).Path,(Resolve-Path out/bins/tools/spirv-val.exe).Path,(Resolve-Path out/bins/tools/spirv-cross.exe).Path,$dxcs[0].FullName,(Resolve-Path out/bins/offscreen_check.exe).Path,'warp')
          $src='tests/spirv_window'
          foreach ($case in 'normal','old-quantized','new-quantized') {
            $dir=New-Item -ItemType Directory -Force "out/$case"
            Copy-Item "$src/minlod.spvasm","$src/minlod_control.hlsl","$src/minlod_fractional.py" -Destination $dir
            $module=Get-Content -Raw "$src/minlod_levels.py"
            if ($case -eq 'old-quantized') { $module=(git show "HEAD^:tests/spirv_window/minlod_levels.py") -join [char]10 }
            if ($case -ne 'normal') {
              $needle='{anchor}%clamp = OpConstant %float {clamp}'
              if (-not $module.Contains($needle)) { throw 'Missing translated SPIR-V constant' }
              $module=$module.Replace($needle,'{anchor}%clamp = OpConstant %float {round(float(clamp) * 128) / 128}')
            }
            $module | Set-Content "$dir/minlod_levels.py" -Encoding utf8
            $lines=python -B "$dir/minlod_fractional.py" @argsList 2>&1
            $rc=$LASTEXITCODE
            $lines | Select-String 'selected_mip=|RuntimeError:|^driver=|^backend=warp debug_layer=' | Select-Object -Last 21
            if (-not ($lines -match '^backend=warp debug_layer=enabled') -or -not ($lines -match 'debug_errors=0 debug_warnings=0')) { throw 'Missing debug layer' }
            if ($case -eq 'new-quantized') {
              if ($rc -ne 1 -or -not ($lines -match 'Clamp 1[.]49609375 read mip 2 translated, mip 1 in the HLSL control')) { throw 'Wrong shader did not fail at the measured edge' }
            } elseif ($rc) { throw "$case exited $rc" }
          }
