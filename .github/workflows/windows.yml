name: Read back source-built raster winding and culling
on: workflow_dispatch
permissions:
  contents: read
jobs:
  warp:
    if: github.repository == 'RavenCurseBurg/Xbox2Windows' && github.ref == 'refs/heads/verify/slot57-raster-readback'
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - name: Build and smoke-test the baseline and reference renderer
        shell: pwsh
        run: ./tools/package-gpu-check.ps1
      - name: Six raster states and four negative controls on WARP
        shell: pwsh
        run: |
          $build = 'out/build/gpu-check-release'
          $dxc = ((Select-String -LiteralPath "$build/CMakeCache.txt" -Pattern '^DXC_EXECUTABLE:FILEPATH=(.+)$').Matches[0].Groups[1].Value)
          python -B tests/raster_winding_reference.py "$dxc" "$build/offscreen_check.exe" warp
          exit $LASTEXITCODE
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: raster-readback
          path: |
            out/gpu-check/Xbox2Windows-GpuCheck-win-x64.zip
            out/gpu-check/Xbox2Windows-GpuCheck-win-x64.zip.sha256
          if-no-files-found: error
          retention-days: 2
