name: Review requested Windows 2025 WARP presets
on:
  push:
    branches: ['verify/nov26-warp-review-pair']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  verify:
    if: github.repository == 'RavenCurseBurg/Xbox2Windows' && github.ref == 'refs/heads/verify/nov26-warp-review-pair'
    name: 'PR ${{ matrix.pr }} / ${{ matrix.preset }} WARP'
    runs-on: windows-2025
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        pr: [2406, 2412]
        preset: [dev, release]
        include:
          - pr: 2406
            source: 2eda17771b79e803e6c0dd95ed402ac2fd5dd1bc
            tests: '^(spirv_sampler_views|sampler_index_control)_warp$'
          - pr: 2412
            source: 3d1b95c315c3a0941065ed9493d7147b6910e691
            tests: '^spirv_minlod_fractional_warp$'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ matrix.source }}
          persist-credentials: false
      - name: Verify pinned SPIR-V tools
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 45645071330 -R RavenCurseBurg/Xbox2Windows -n split-sampler-readback-build -D out/tool-input
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          if ((Get-Content out/tool-input/SOURCE_COMMIT.txt) -ne 'c601e6e9dcee2a96fc5b103f0bfedfe39557002d') { throw 'Wrong artifact source' }
          foreach ($line in Get-Content out/tool-input/SHA256SUMS) {
            $digest,$file=$line -split '  ',2
            if ((Get-FileHash (Join-Path out/tool-input $file)).Hash -ne $digest) { throw "Digest mismatch $file" }
          }
      - name: Build renderer from the PR and run its WARP tests
        shell: pwsh
        env:
          PRESET: ${{ matrix.preset }}
          PR_NUMBER: ${{ matrix.pr }}
          PR_SOURCE: ${{ matrix.source }}
          TEST_REGEX: ${{ matrix.tests }}
        run: |
          if ((git rev-parse HEAD) -ne $env:PR_SOURCE) { throw 'Wrong source' }
          ./tools/dev.ps1
          python -m venv out/pe-env
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          ./out/pe-env/Scripts/python.exe -m pip install -r requirements-dev.txt
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $tools=(Resolve-Path out/tool-input/tools).Path
          cmake --preset $env:PRESET "-DSPIRV_WINDOW_AS=$tools/spirv-as.exe" "-DSPIRV_WINDOW_VAL=$tools/spirv-val.exe" "-DSPIRV_WINDOW_CROSS=$tools/spirv-cross.exe"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $buildType=if ($env:PRESET -eq 'dev') { 'Debug' } else { 'Release' }
          if (-not (Select-String -Path "out/build/$env:PRESET/CMakeCache.txt" -Pattern "^CMAKE_BUILD_TYPE:STRING=$buildType$")) { throw 'Unexpected build type' }
          cmake --build --preset $env:PRESET --target offscreen_check
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $lines=ctest --preset $env:PRESET --no-tests=error -j 1 -V -R $env:TEST_REGEX 2>&1
          $rc=$LASTEXITCODE
          $lines | Set-Content out/verification.log
          $lines | Select-String 'sampler swap|dispatch_thread_control=|missing comparison stores|selected_mip=|negative clamp=|pixel_mismatch x=0 y=0|debug_layer=|debug_errors=|tests failed out of'
          if ($rc -or $lines -match '\*\*\*Skipped|Not Run|debug_errors=[1-9]|debug_warnings=[1-9]' -or -not ($lines -match 'debug_layer=enabled')) { $lines | Select-Object -Last 100; throw "CTest status $rc" }
          if ($env:PR_NUMBER -eq '2406') {
            foreach ($row in 'sampler swap 0: sample 0.25 0.75, comparison 0 1','sampler swap 1: sample 0.75 0.25, comparison 0 1','sampler swap 2: sample 0.25 0.75, comparison 1 0') {
              if (@($lines -match [regex]::Escape($row)).Count -lt 2) { throw "Missing translated rows $row" }
            }
            $required=@('2/2 Test','dispatch_thread_control=pass group_index_reproduction=matches','sampler swap 1 word 2: expected=00000000 actual=c0400000','sampler swap 1 word 3: expected=3f800000 actual=c0800000')
          } else {
            $required=@('1/1 Test','pixel_mismatch x=0 y=0')
            foreach ($kind in 'translated','control') {
              foreach ($entry in 'clamp=1.49609375 selected_mip=1','clamp=1.99609375 selected_mip=2','clamp=2 selected_mip=2','negative clamp=1.5625 mip=0') {
                $required+="$kind $entry"
              }
            }
          }
          foreach ($row in $required) {
            if (-not ($lines -match [regex]::Escape($row))) { throw "Missing expected readback: $row" }
          }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: 'pr-${{ matrix.pr }}-${{ matrix.preset }}-readback'
          path: out/verification.log
          if-no-files-found: ignore
          retention-days: 3
