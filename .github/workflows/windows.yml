name: Verify expanded FLOAT2 heap stores on WARP
on: workflow_dispatch
permissions:
  contents: read
jobs:
  readback:
    if: github.repository == 'RavenCurseBurg/Xbox2Windows' && github.ref == 'refs/heads/verify/heap-d16-float2'
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: 85e045382fc652946d7f21112824a667595a7bc3
          persist-credentials: false
      - name: Build the test renderer with the project-supported Agility SDK
        shell: pwsh
        run: |
          ./tools/dev.ps1
          python -m venv out/pe-env
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          out/pe-env/Scripts/python.exe -m pip install -r requirements-dev.txt
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $sdk = New-Item -Force -ItemType Directory out/agility
          $pkg = Join-Path $sdk.FullName 'sdk.nupkg'
          Invoke-WebRequest 'https://api.nuget.org/v3-flatcontainer/microsoft.direct3d.d3d12/1.620.2/microsoft.direct3d.d3d12.1.620.2.nupkg' -OutFile $pkg
          if ((Get-FileHash -LiteralPath $pkg).Hash -ne '70489669C2BBEAF318B62D72B0AC3E753D521387BFC848C9763791C4E920BFCC') { throw 'SDK hash differs' }
          $zip = [IO.Compression.ZipFile]::OpenRead($pkg)
          try {
            foreach ($name in 'D3D12Core.dll','d3d12SDKLayers.dll') {
              [IO.Compression.ZipFileExtensions]::ExtractToFile($zip.GetEntry("build/native/bin/x64/$name"),(Join-Path $sdk.FullName $name))
            }
          } finally { $zip.Dispose() }
          cmake --preset dev "-DOFFSCREEN_AGILITY_620_DIR=$($sdk.FullName)"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cmake --build --preset dev --target offscreen_check
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          ctest --preset dev --no-tests=error -V -R '^compute_(heap_store_controls|store_aot_heap_view_store_warp)$' | Tee-Object -FilePath out/heap-readback.log
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          if (Select-String -Quiet -Path out/heap-readback.log -Pattern '\*\*\*Skipped|\*\*\*Not Run') { throw 'A selected test skipped' }
          foreach ($expected in 'heap-store controls passed','warp D16_XY-to-FLOAT2: 17 heap-store cases and 11 shader mutations checked','warp D16_X-to-FLOAT1: 16 heap-store cases and 11 shader mutations checked','warp D16-to-FLOAT4: 12 heap-store cases and 11 shader mutations checked','warp UINT4: 12 heap-store cases and 8 shader mutations checked') {
            if (!(Select-String -Quiet -Path out/heap-readback.log -SimpleMatch $expected)) { throw "Missing result: $expected" }
          }
          $runner = (Get-ChildItem out/build -Recurse -Filter offscreen_check.exe | Select-Object -First 1).FullName
          $dxcLine = (Select-String -Path out/build/dev/CMakeCache.txt -Pattern '^DXC_EXECUTABLE:FILEPATH=').Line
          $dxc = $dxcLine.Substring($dxcLine.IndexOf('=')+1)
          @"
          from pathlib import Path
          import subprocess, sys, tempfile
          sys.path.insert(0, "tests")
          import compute_heap_store_check as t
          original = subprocess.run
          total = 0
          def check(args, **kwargs):
              global total
              result = original(args, **kwargs)
              if "--compute-store-case" in args:
                  assert "debug_layer=enabled" in result.stdout, result.stdout
                  if result.returncode == 0:
                      assert "debug_errors=0 debug_warnings=0" in result.stdout, result.stdout
                      total += 1
              return result
          subprocess.run = check
          with tempfile.TemporaryDirectory() as tmp:
              assert t.draw(Path(tmp), sys.argv[1], sys.argv[2], "warp", "d16_xy") == 0
          assert total == 17, total
          print(f"{total} positive FLOAT2 dispatches with debug layer enabled and zero warnings/errors")
          "@ | out/pe-env/Scripts/python.exe -B - $dxc $runner
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
