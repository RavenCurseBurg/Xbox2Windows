name: Build the mesh lease fixture for independent hardware readback
on: workflow_dispatch
permissions:
  contents: read
jobs:
  d16:
    if: github.repository == 'RavenCurseBurg/Xbox2Windows' && github.ref == 'refs/heads/verify/mesh86-lease-hardware'
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: 61a2d3139ccca613420a097018af8a7f881a359d
          persist-credentials: false
      - name: Build the test renderer with the project-supported Agility SDK
        shell: pwsh
        run: |
          ./tools/dev.ps1
          python -m venv out/pe-env
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          out/pe-env/Scripts/python.exe -m pip install -r requirements-dev.txt
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $sdk = New-Item -Force -ItemType Directory out/agility
          $pkg = Join-Path $sdk.FullName 'sdk.nupkg'
          Invoke-WebRequest 'https://api.nuget.org/v3-flatcontainer/microsoft.direct3d.d3d12/1.620.2/microsoft.direct3d.d3d12.1.620.2.nupkg' -OutFile $pkg
          if ((Get-FileHash -LiteralPath $pkg).Hash -ne '70489669C2BBEAF318B62D72B0AC3E753D521387BFC848C9763791C4E920BFCC') { throw 'SDK hash differs' }
          $zip = [IO.Compression.ZipFile]::OpenRead($pkg)
          try {
            foreach ($name in 'D3D12Core.dll','d3d12SDKLayers.dll') {
              [IO.Compression.ZipFileExtensions]::ExtractToFile($zip.GetEntry("build/native/bin/x64/$name"),(Join-Path $sdk.FullName $name))
            }
          } finally { $zip.Dispose() }
          cmake --preset dev -B out/lease-build -DCMAKE_BUILD_TYPE=Release -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded "-DOFFSCREEN_AGILITY_620_DIR=$($sdk.FullName)"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cmake --build out/lease-build --target startup_indirect_draw_indexed xmem_shim
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $stage = New-Item -ItemType Directory -Force out/lease-fixture
          foreach ($name in 'startup_indirect_draw_indexed.exe','xmem.dll','d3d12_xs.dll') {
            Copy-Item -LiteralPath (Join-Path out/lease-build $name) -Destination $stage
            $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath (Join-Path $stage $name)).Hash
            "$hash $name" | Add-Content -Encoding ascii (Join-Path $stage 'SHA256SUMS')
          }
          (git rev-parse HEAD) | Set-Content -Encoding ascii (Join-Path $stage 'SOURCE_COMMIT')
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mesh86-lease-fixture
          path: out/lease-fixture/
          retention-days: 2
          if-no-files-found: error
