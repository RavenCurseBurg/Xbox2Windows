name: Verify LDS exchange with the WARP debug layer
on: workflow_dispatch
permissions:
  contents: read
jobs:
  readback:
    if: github.repository == 'RavenCurseBurg/Xbox2Windows' && github.ref == 'refs/heads/verify/startup-lds-dword'
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: cd420544b74eae45a1b351b11bbd828cdba6d9ad
          persist-credentials: false
      - name: Build the test renderer with the project-supported Agility SDK
        shell: pwsh
        run: |
          ./tools/dev.ps1
          python -m venv out/pe-env
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          out/pe-env/Scripts/python.exe -m pip install -r requirements-dev.txt
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $sdk = New-Item -Force -ItemType Directory out/agility
          $pkg = Join-Path $sdk.FullName 'sdk.nupkg'
          Invoke-WebRequest 'https://api.nuget.org/v3-flatcontainer/microsoft.direct3d.d3d12/1.620.2/microsoft.direct3d.d3d12.1.620.2.nupkg' -OutFile $pkg
          if ((Get-FileHash -LiteralPath $pkg).Hash -ne '70489669C2BBEAF318B62D72B0AC3E753D521387BFC848C9763791C4E920BFCC') { throw 'SDK hash differs' }
          $zip = [IO.Compression.ZipFile]::OpenRead($pkg)
          try {
            foreach ($name in 'D3D12Core.dll','d3d12SDKLayers.dll') {
              [IO.Compression.ZipFileExtensions]::ExtractToFile($zip.GetEntry("build/native/bin/x64/$name"),(Join-Path $sdk.FullName $name))
            }
          } finally { $zip.Dispose() }
          cmake --preset dev "-DOFFSCREEN_AGILITY_620_DIR=$($sdk.FullName)"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cmake --build --preset dev --target offscreen_check
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          ctest --preset dev --no-tests=error -V -R '^startup_gfx2hlsl_(compute_.*|saveexec_same_reg_controls)$' -E 'hardware' | Tee-Object -FilePath out/compute-readback.log
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          if (Select-String -Quiet -Path out/compute-readback.log -Pattern '\*\*\*Skipped|\*\*\*Not Run') { throw 'A selected test skipped' }
          foreach ($expected in 'case F: all 320 words match','control f-peer: rejected at word=0 expected=00000020 actual=00000000','control f-broadcast: rejected at word=1 expected=00000025 actual=00000024') {
            if (!(Select-String -Quiet -Path out/compute-readback.log -SimpleMatch $expected)) { throw "Missing measured result: $expected" }
          }
