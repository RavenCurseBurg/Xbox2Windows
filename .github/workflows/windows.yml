name: Build the two-SRV guest graphics fixture
on:
  push:
    branches: ['verify/graphics-joined-table']
permissions:
  contents: read
jobs:
  timing:
    if: github.repository == 'RavenCurseBurg/Xbox2Windows' && github.ref == 'refs/heads/verify/graphics-joined-table'
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: 1bf7826217e7c18b53676649fb7a375323e5b565
          persist-credentials: false
      - name: Build the stream consumer and collect source digests
        shell: pwsh
        run: |
          ./tools/dev.ps1
          python -m venv out/pe-env
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          out/pe-env/Scripts/python.exe -m pip install -r requirements-dev.txt
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cmake --preset dev -B out/mrt -DCMAKE_BUILD_TYPE=Release -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cmake --build out/mrt --target startup_stream_consumer offscreen_check
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $stage = New-Item -ItemType Directory -Force out/mrt-artifact
          foreach ($name in 'xg_xs.dll','d3d12_xs.dll','startup_stream_consumer.exe','offscreen_check.exe') {
            $files = @(Get-ChildItem out/mrt -File -Recurse -Filter $name)
            if ($files.Count -ne 1) { throw "Expected one built $name" }
            Copy-Item -LiteralPath $files[0].FullName -Destination $stage
          }
          (git rev-parse HEAD) | Set-Content -Encoding ascii "$stage/SOURCE_COMMIT.txt"
          Get-ChildItem $stage -File | ForEach-Object { '{0}  {1}' -f (Get-FileHash -LiteralPath $_.FullName).Hash,$_.Name } | Set-Content -Encoding ascii "$stage/SHA256SUMS"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: joined-table-consumer
          path: out/mrt-artifact/
          retention-days: 2
          if-no-files-found: error
      - name: Run the guest table readback with both compilers
        shell: pwsh
        run: |
          ./tools/dev.ps1
          $rows=ctest --test-dir out/mrt -V --no-tests=error -R '^startup_(joined_table_pointer_(cpu|(fxc|dxc)_warp)|gfx2hlsl_compute_(controls|warp))$' 2>&1
          $rc=$LASTEXITCODE
          $rows | Tee-Object -FilePath out/graphics-table.log | Select-Object -Last 20
          if ($rc -or $rows -match '\*\*\*Skipped|Not Run') {throw "CTest failed or skipped (exit $rc)"}
          if (-not ($rows -match 'case I-raw: all 320 words match')) {throw 'Missing structured-to-raw compute readback'}
          foreach ($kind in 'fxc','dxc') {
            foreach ($change in 0,32) {
              $seen=@($rows | Select-String -Pattern "$kind warp table byte (0|32), $change pixels changed from the source expectation")
              if ($seen.Count -ne 5) {throw "Expected five $kind readbacks with $change changed pixels, got $($seen.Count)"}
            }
          }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: joined-table-ctest
          path: out/graphics-table.log
          if-no-files-found: ignore
          retention-days: 2
