name: Verify pixel readback dimensions
on: workflow_dispatch
permissions:
  contents: read
jobs:
  dimensions:
    if: github.repository == 'RavenCurseBurg/Xbox2Windows' && github.ref == 'refs/heads/verify/pixel-word-dimensions'
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: bfb1f61ae5a1279c28e759ee2a92717d74a85bec
          persist-credentials: false
      - name: Build the exact revision and test CLI resolution and a WARP readback
        shell: pwsh
        run: |
          ./tools/dev.ps1
          python -m venv out/pe-env
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cmake --preset dev
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cmake --build --preset dev --target offscreen_check
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $lines = ctest --preset dev --no-tests=error -V -R '^(offscreen_capability_table_self_test|startup_gfx2hlsl_dpp_quad_swap_warp)$' 2>&1
          $rc = $LASTEXITCODE
          $lines | Write-Output
          $log = $lines -join [Environment]::NewLine
          if ($rc -ne 0 -or $log -notmatch 'offscreen_capability_table_self_test [ .]+Passed' -or $log -notmatch 'startup_gfx2hlsl_dpp_quad_swap_warp [ .]+Passed') { throw 'Both named tests must execute' }
      - name: Run invalid width and height through the executable
        shell: pwsh
        run: |
          foreach ($sample in @(@('8x4', '4'), @('8', '4junk'))) {
            $lines = & ./out/build/dev/offscreen_check.exe warp --startup-pixel-words vs ps $sample[0] $sample[1] ref 2>&1
            $rc = $LASTEXITCODE
            $lines | Write-Output
            $log = $lines -join [Environment]::NewLine
            if ($rc -ne 2 -or $log -notmatch 'invalid arguments: --startup-pixel-words' -or $log -match 'backend=') { throw 'Expected a usage error before GPU initialization' }
          }
          exit 0
