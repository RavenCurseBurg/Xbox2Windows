name: Verify the ordinary sampler descriptor
on: workflow_dispatch
permissions:
  contents: read
jobs:
  sampler:
    if: github.repository == 'RavenCurseBurg/Xbox2Windows' && github.ref == 'refs/heads/verify/ordinary-sampler-comparison'
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: bf9bf8bc0196147ab2ba6ce37b11423f570861aa
          persist-credentials: false
      - name: Build and smoke-test the candidate renderer
        shell: pwsh
        run: ./tools/package-gpu-check.ps1
      - name: Check descriptors and WARP readbacks
        shell: pwsh
        run: |
          ./tools/dev.ps1
          $build = 'out/build/gpu-check-release'
          cmake --build $build --target startup_translated_sampler_bindings_check startup_sampler_comparison_check
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          ctest --test-dir $build --no-tests=error -R '^startup_(translated_sampler_bindings|sampler_comparison)$' --output-on-failure
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $dxc = ((Select-String -LiteralPath "$build/CMakeCache.txt" -Pattern '^DXC_EXECUTABLE:FILEPATH=(.+)$').Matches[0].Groups[1].Value)
          python -B tests/startup_sampler_heap_check.py draw "$dxc" "$build/offscreen_check.exe" warp
          exit $LASTEXITCODE
      - name: Restore ALWAYS and require both regression checks to fail
        shell: pwsh
        run: |
          ./tools/dev.ps1
          $build = 'out/build/gpu-check-release'
          $header = 'src/startup_stubs/translated_sampler_bindings.h'
          $source = Get-Content -Raw -LiteralPath $header
          $mutant = $source.Replace('s.ComparisonFunc = D3D12_COMPARISON_FUNC_NEVER;', 's.ComparisonFunc = D3D12_COMPARISON_FUNC_ALWAYS;')
          if ($mutant -eq $source) { throw 'Missing mutation site' }
          [IO.File]::WriteAllText((Resolve-Path $header), $mutant)
          cmake --build $build --target startup_translated_sampler_bindings_check startup_sampler_comparison_check
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $ordinary = & "$build/startup_translated_sampler_bindings_check.exe" 2>&1
          if ($LASTEXITCODE -eq 0 -or ($ordinary -join ' ') -notmatch 'ComparisonFunc') { throw 'Ordinary-descriptor control escaped detection' }
          $mixed = & "$build/startup_sampler_comparison_check.exe" 2>&1
          if ($LASTEXITCODE -eq 0 -or ($mixed -join ' ') -notmatch 'ordinary sampler at register 0') { throw 'Mixed-manifest control escaped detection' }
          Write-Output 'Both checks rejected the restored ALWAYS field'
          exit 0
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gpu-check-sampler
          path: |
            out/gpu-check/Xbox2Windows-GpuCheck-win-x64.zip
            out/gpu-check/Xbox2Windows-GpuCheck-win-x64.zip.sha256
          if-no-files-found: error
          retention-days: 2
