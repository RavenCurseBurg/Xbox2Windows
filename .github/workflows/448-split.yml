name: Verify formatted compute stores with sized UAVs on WARP
on:
  push:
    branches: ['verify/2530-formatted-compute']
permissions:
  contents: read
jobs:
  build:
    if: github.repository == 'RavenCurseBurg/Xbox2Windows'
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: 3014c7b78b28d209b954b1924bf5e18d3e1fc220
          persist-credentials: false
      - name: Build the Debug renderer and run the WARP fixtures with the debug layer
        shell: pwsh
        run: |
          ./tools/dev.ps1
          python -m venv out/pe-env
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          out/pe-env/Scripts/python.exe -m pip install -r requirements-dev.txt
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cmake --preset dev -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreadedDebug
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cmake --build --preset dev --target offscreen_check
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $stage = New-Item -ItemType Directory out/pixel-timing
          $build = 'out/build/dev'
          Copy-Item "$build/offscreen_check.exe" -Destination $stage
          $rows = ctest --preset dev -V -j 1 --no-tests=error --output-junit "$stage/results.xml" -R '^startup_compute_store_(format_xyzw|d16_x)_(controls|warp|.*_warp)$' 2>&1
          $rc = $LASTEXITCODE
          $rows | Set-Content "$stage/ctest.log"
          $rows | Select-Object -Last 12
          [xml]$junit = Get-Content -Raw "$stage/results.xml"
          $cases = @($junit.testsuite.testcase)
          (git rev-parse HEAD) | Set-Content -Encoding ascii "$stage/SOURCE_COMMIT.txt"
          Get-ChildItem $stage -File | ForEach-Object { '{0}  {1}' -f (Get-FileHash $_.FullName).Hash,$_.Name } | Set-Content -Encoding ascii "$stage/SHA256SUMS"
          if ($rc -or $cases.Count -ne 23 -or @($cases | Where-Object status -ne 'run').Count) {throw "CTest exited $rc, $($cases.Count) results"}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: compute-formatted-2530
          path: out/pixel-timing/
          if-no-files-found: error
          retention-days: 2
