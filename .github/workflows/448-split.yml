name: Verify the reviewer's mesh preflight and actual predicate draw on Windows Release
on:
  push:
    branches: ['verify/2541-review-release']
permissions:
  contents: read
jobs:
  build:
    if: github.repository == 'RavenCurseBurg/Xbox2Windows'
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: e5484d6c70a711c1a0335d521a8a12b3abab07f6
          persist-credentials: false
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: 5123cc6d0cd9c7730d39e9d989f38dc060a987d1
          path: out/predicate-base
          persist-credentials: false
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          path: out/harness
          persist-credentials: false
      - name: Check both mesh invocations, build Release and run the predicate WARP fixture
        shell: pwsh
        run: |
          ./tools/dev.ps1
          python -m venv out/pe-env
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          out/pe-env/Scripts/python.exe -m pip install -r requirements-dev.txt
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          foreach ($root in '.','out/predicate-base') {
            $script = Join-Path $root 'tests/mesh_entry_check.py'
            $failure = out/pe-env/Scripts/python.exe -B $script 2>&1
            if ($LASTEXITCODE -ne 1 -or -not ($failure -match 'IndexError: list index out of range')) {throw "Different argumentless result in $root"}
            foreach ($mode in 'skipped','flat-scratch') {
              out/pe-env/Scripts/python.exe -B $script $mode
              if ($LASTEXITCODE) {throw "Failed $mode on $root"}
            }
          }
          cmake --preset release -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cmake --build --preset release --target offscreen_check
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $stage = New-Item -ItemType Directory out/pixel-timing
          $build = 'out/build/release'
          Copy-Item "$build/offscreen_check.exe" -Destination $stage
          $rows = ctest --preset release -V -j 1 --no-tests=error --output-junit "$stage/results.xml" -R '^(pixel_aot_comparisons_warp|mesh_entry_(skipped_scalar|flat_scratch)_cpu)$' 2>&1
          $rc = $LASTEXITCODE
          $rows | Set-Content "$stage/ctest.log"
          $rows | Select-Object -Last 12
          [xml]$junit = Get-Content -Raw "$stage/results.xml"
          $cases = @($junit.testsuite.testcase)
          if ($rc -or $cases.Count -ne 3 -or @($cases | Where-Object status -ne 'run').Count) {throw "CTest exited $rc"}
          Copy-Item "$build/form_coverage/pixel_aot_comparisons_warp.txt" -Destination $stage
          $dxc = (Get-Command dxc.exe).Source
          $renderer = (Resolve-Path "$build/offscreen_check.exe").Path
          foreach ($revision in 'base','candidate') {
            $source = if ($revision -eq 'base') {'out/predicate-base'} else {'.'}
            out/pe-env/Scripts/python.exe -B out/harness/.github/scripts/verify_predicate_replay.py $source "$stage/$revision" out/draw-inputs $dxc $renderer warp
            if ($LASTEXITCODE) {exit $LASTEXITCODE}
          }
          if ((Get-FileHash "$stage/base.json").Hash -ne (Get-FileHash "$stage/candidate.json").Hash) {throw 'HLSL, shader, reference, case result, or form record changed'}
          (git rev-parse HEAD) | Set-Content -Encoding ascii "$stage/SOURCE_COMMIT.txt"
          Get-ChildItem $stage -File | ForEach-Object { '{0}  {1}' -f (Get-FileHash $_.FullName).Hash,$_.Name } | Set-Content -Encoding ascii "$stage/SHA256SUMS"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: predicate-review-release
          path: out/pixel-timing/
          if-no-files-found: error
          retention-days: 2
